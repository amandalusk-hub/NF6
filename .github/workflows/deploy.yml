name: Auto-deploy to Apps Script

# Fires on every push to main OR any claude/* working branch. Also runnable
# manually from the Actions tab (Run workflow) if a deploy needs a re-run
# without another commit.
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy.yml'
      - '.github/scripts/**'
  workflow_dispatch:

# One deploy at a time per branch — if two commits land back-to-back, cancel
# the older run so we don't race two pushes into the same script.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    # Workload Identity Federation requires id-token write perm so the
    # workflow can exchange its GitHub OIDC token for a GCP access token.
    # No key file, no clasp login, no monthly reauth dance.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Exchanges this workflow's GitHub OIDC token for a short-lived GCP
      # access token that impersonates the apps-script-deployer service
      # account. No keys involved — the trust was wired up in Cloud Shell
      # via `workload-identity-pools providers create-oidc`.
      - name: Authenticate to Google Cloud via WIF
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token
          access_token_scopes: >-
            https://www.googleapis.com/auth/script.projects,https://www.googleapis.com/auth/script.deployments

      - name: Deploy to Apps Script
        env:
          APPS_SCRIPT_ID: ${{ secrets.APPS_SCRIPT_ID }}
          DEPLOYMENT_ID:  ${{ secrets.DEPLOYMENT_ID }}
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: node .github/scripts/deploy-apps-script.js

      - name: Summary
        if: always()
        run: |
          echo "### Apps Script deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- Auth: Workload Identity Federation (no key file)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If this failed with an auth error, check that the Apps Script project is shared with the service account email as an Editor." >> $GITHUB_STEP_SUMMARY
