name: Auto-deploy to Apps Script

# Fires on every push to main OR any claude/* working branch. Also runnable
# manually from the Actions tab (Run workflow) if a deploy needs a re-run
# without another commit.
on:
  push:
    branches:
      - main
      - 'claude/**'
    paths:
      - 'apps-script/**'
      - '.clasp.json'
      - '.claspignore'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# One deploy at a time per branch — if two commits land back-to-back, cancel
# the older run so we don't race two clasp pushes into the same script.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp@latest

      - name: Restore Google auth from secret
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::CLASPRC_JSON secret is not set. Run tools/refresh-deploy-token.bat on your Windows machine to refresh it."
            exit 1
          fi
          echo "$CLASPRC_JSON" > $HOME/.clasprc.json
          chmod 600 $HOME/.clasprc.json

      - name: Confirm clasp can see the project
        env:
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: |
          if [ -n "$SCRIPT_ID" ]; then
            cat > .clasp.json <<EOF
          {
            "scriptId": "$SCRIPT_ID",
            "rootDir": "apps-script"
          }
          EOF
          fi
          clasp status || true

      - name: Push code to Apps Script
        run: clasp push -f

      - name: Update live deployment
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$DEPLOYMENT_ID" ]; then
            echo "::warning::DEPLOYMENT_ID secret is not set — pushed code but did not update a deployment."
            exit 0
          fi
          LABEL="CI $(echo "$COMMIT_SHA" | cut -c1-7): $(echo "$COMMIT_MSG" | head -n1 | cut -c1-80)"
          clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$LABEL"

      - name: Summary
        if: always()
        run: |
          echo "### Apps Script deploy" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Status: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "If this failed with an auth error, double-click \`tools/refresh-deploy-token.bat\` on your Windows machine to refresh the token in ~30 seconds." >> $GITHUB_STEP_SUMMARY
